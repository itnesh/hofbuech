name: Sensoren laden (akenza, Agrometeo)
on:
  schedule:
    - cron: '7 * * * *'   # stündlich
  workflow_dispatch:
    inputs:
      force:
        description: 'Agrometeo sofort neu laden'
        type: boolean
        default: true
jobs:
  sensoren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev
        working-directory: scripts
      - run: node sensoren.mjs
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          CORS_TEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
